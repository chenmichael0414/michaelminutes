name: Daily Green Square

on:
  schedule:
    - cron: "10 22 * * *"
      timezone: "America/New_York"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-green-square-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check-in:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Make daily check-in
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "Michael Chen"
          git config user.email "85696532+chenmichael0414@users.noreply.github.com"

          git pull --rebase origin main

          # Hosted runners can start after midnight when GitHub Actions is busy.
          # A six-hour grace period keeps a delayed run attached to its intended day.
          target_date="$(TZ=America/New_York date --date='6 hours ago' +%F)"
          checkin_date="2026-08-07"
          created_any=false

          mkdir -p devlog

          while [[ "${checkin_date}" < "${target_date}" || "${checkin_date}" == "${target_date}" ]]; do
            checkin_file="devlog/${checkin_date}.md"

            if [[ ! -f "${checkin_file}" ]]; then
              cat > "${checkin_file}" <<EOF
          # ${checkin_date}

          Automated daily check-in.
          EOF

              offset="$(TZ=America/New_York date --date="${checkin_date} 22:10:00" +%z)"
              offset_with_colon="${offset:0:3}:${offset:3:2}"
              export GIT_AUTHOR_DATE="${checkin_date}T22:10:00${offset_with_colon}"
              export GIT_COMMITTER_DATE="${GIT_AUTHOR_DATE}"

              git add "${checkin_file}"
              git commit -m "Daily check-in ${checkin_date}"
              created_any=true
            fi

            checkin_date="$(date -u --date="${checkin_date} + 1 day" +%F)"
          done

          if [[ "${created_any}" == true ]]; then
            git push origin HEAD:main
          else
            echo "All daily check-ins exist through ${target_date}."
          fi
